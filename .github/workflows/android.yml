# Builds the SINGAAR Android app (APK) on GitHub's servers and publishes it as a GitHub Release.
# The website's "Download the app" button points at the newest release:
#   https://github.com/preethicrown/singaar/releases/latest/download/singaar.apk
# The app is a native shell (Capacitor) around https://singaar.vercel.app/app/, so app changes go live
# the moment Vercel deploys; a new APK is only needed when the shell, icon or splash changes.
name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'assets/icon-512.webp'
      - 'assets/logo.webp'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Create the Android project, icons and splash
        working-directory: mobile
        run: |
          npx cap add android
          npm run assets
          # location: show artists near you; the outfit photo uses the system file picker (no extra permission)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          N=${{ github.run_number }}
          sed -i "s/versionCode 1$/versionCode $N/; s/versionName \"1.0\"/versionName \"1.0.$N\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../singaar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: singaar-apk
          path: mobile/singaar.apk

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: SINGAAR for Android 1.0.${{ github.run_number }}
          make_latest: true
          files: mobile/singaar.apk
          body: |
            Install: open this page on an Android phone, tap **singaar.apk**, then allow installing from your browser if Android asks.
            This test build is signed for direct install. The Google Play listing comes next.
